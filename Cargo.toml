[package]
name = "rsipstack"
version = "0.7.3"
edition = "2021"
description = "SIP Stack Rust library for building SIP applications"
license = "MIT"
repository = "https://github.com/restsend/rsipstack"
readme = "README.md"
keywords = ["sip", "voip", "telephony", "sipstack"]
authors = ["jinti<shenjindi@fourz.cn>"]
categories = ["network-programming", "multimedia"]
exclude = [
    "examples/",
    "assets/*",
    ".github/*",
    "Dockerfile*",
    ".dockerignore",
    "flake.lock",
]


[lib]
# rlib only: the FFI boundary lives in downstream integrators (rtcembed).
# A `cdylib` build of a no_std crate would demand a `#[global_allocator]` +
# `#[panic_handler]` from this crate, which belongs to the firmware instead.
crate-type = ["rlib"]

[[bin]]
name = "bench_ua"
path = "src/bin/bench_ua.rs"
required-features = ["bench"]

[dependencies]
async-trait = "0.1.89"
futures = { version = "0.3.32", default-features = false, features = ["async-await"] }
thiserror = { version = "2.0.18", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
tokio-util = { version = "0.7.18", features = ["full"], optional = true }
rand = { version = "0.10.1", optional = true }
md-5 = "0.11.0"
sha2 = "0.11.0"
if-addrs = { version = "0.14", optional = true }
hickory-resolver = { version = "0.26.1", features = [
    "system-config",
    "tokio",
], optional = true }
bytes = { version = "1.11.1", default-features = false }
memchr = { version = "2", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc"] }
parking_lot = { version = "0.12", optional = true }
tokio-tungstenite = { version = "0.29.0", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls-pki-types = { version = "1", features = ["alloc"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
clap = { version = "4.5.53", optional = true, features = ["derive"] }
tracing-subscriber = { version = "0.3.22", optional = true, features = ["local-time"] }
socket2 = { version = "0.6.3", optional = true, features = ["all"] }

[features]
default = ["platform-tokio", "std", "rustls", "websocket", "srv_lookup"]
# Runtime backend: tokio. The embassy backend lands in WP3 (embedded plan).
platform-tokio = ["dep:tokio", "dep:tokio-util", "dep:parking_lot", "std", "tokio-util?/full", "dep:socket2", "dep:if-addrs", "dep:rand"]
platform-embassy = [
    "dep:embassy-time",
    "dep:embassy-sync",
    "dep:critical-section",
]
# Host std support; no_std targets (embassy) build with --no-default-features.
std = ["platform-tokio"]
srv_lookup = ["dep:hickory-resolver"]
rustls = ["tokio-rustls", "rustls-pki-types", "dep:rustls", "base64/std"]
websocket = ["tokio-tungstenite"]
all-transports = ["rustls", "websocket", "srv_lookup"]
# Host benchmark binaries (src/bin/*) — not part of the library API.
bench = ["dep:clap", "dep:tracing-subscriber", "platform-tokio"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.50.0", features = ["time", "sync", "macros", "io-util"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.50.0", features = ["full"], optional = true }

embassy-sync = { version = "0.7", optional = true, default-features = false }
embassy-time = { version = "0.5", optional = true, default-features = false }
critical-section = { version = "1", optional = true }

[dev-dependencies]
dotenvy = "0.15.7"
tempfile = "3"
sdp-rs = "0.2.1"
rtp-rs = "0.6.0"
axum = { version = "0.8.8", features = ["ws"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
http = "1.4.0"

[[example]]
name = "client"
path = "examples/client/main.rs"
required-features = ["bench"]

[[example]]
name = "proxy"
path = "examples/proxy.rs"
required-features = ["bench"]
